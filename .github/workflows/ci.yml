name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend with dev extras
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run unit tests
        run: python -m pytest -q

      - name: Verify OpenAPI contract is up to date
        run: |
          python scripts/export_openapi.py > /tmp/openapi_current.json
          diff <(python -m json.tool /tmp/openapi_current.json) \
               <(python -m json.tool ../contracts/openapi.json) \
          && echo "OpenAPI contract is current." \
          || (echo "ERROR: contracts/openapi.json is out of date. Run backend/scripts/export_openapi.py and commit." && exit 1)
        working-directory: backend
