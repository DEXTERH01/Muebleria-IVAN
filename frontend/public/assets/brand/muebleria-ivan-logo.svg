      <stop stop-color="#925B38" />
      <stop offset=".48" stop-color="#613C28" />
      <stop offset="1" stop-color="#43291F" />
    </linearGradient>
    <linearGradient id="doorLeft" x1="166" y1="258" x2="244" y2="445" gradientUnits="userSpaceOnUse">
