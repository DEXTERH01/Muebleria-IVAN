    <path d="m255 293 142-95v243H255V293Z" fill="url(#doorRight)" stroke="#E9BB87" stroke-width="4" />

    <!-- Paneles y cantos claros dan profundidad sin perder legibilidad pequeña. -->
    <path d="m178 266 53 33v128" stroke="#F1C99A" stroke-opacity=".38" stroke-width="3" />
    <path d="m269 301 114-76v202" stroke="#FFE1B5" stroke-opacity=".35" stroke-width="3" />
