services:
  - type: web
    name: muebleria-ivan-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MUEBLERIA_ENVIRONMENT
        value: demo
      - key: MUEBLERIA_DATABASE_URL
        sync: false
      - key: MUEBLERIA_SUPABASE_URL
        value: https://uyntocgzizflkpdlhtgp.supabase.co
      - key: MUEBLERIA_CORS_ORIGINS
        sync: false
      - key: MUEBLERIA_SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: MUEBLERIA_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: MUEBLERIA_CLOUDINARY_API_KEY
        sync: false
      - key: MUEBLERIA_CLOUDINARY_API_SECRET
        sync: false
      - key: MUEBLERIA_CLOUDINARY_SIGNATURE_ALGORITHM
        value: sha1
      - key: MUEBLERIA_GROQ_API_KEY
        sync: false
      - key: MUEBLERIA_GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: MUEBLERIA_GROQ_TIMEOUT_SECONDS
        value: 12
      - key: MUEBLERIA_ASSISTANT_REQUESTS_PER_MINUTE
        value: 10
